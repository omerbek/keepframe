name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export AI model (DINOv2-small, Apache-2.0)
        shell: pwsh
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.40" onnx onnxscript
          python tools/export_dinov2_onnx.py
          python -m pip uninstall -y torch transformers
      - name: Install
        run: python -m pip install -e ".[gui,ai,raw,win,build,dev]"
      - name: Test
        run: pytest -q
      - name: Build exe
        run: pyinstaller packaging/keepframe.spec --noconfirm --clean
      - name: Check bundle
        shell: pwsh
        run: |
          if (-not (Test-Path dist\KeepFrame\KeepFrame.exe)) { throw "exe missing" }
          $m = Get-ChildItem dist\KeepFrame -Recurse -Filter *.onnx
          if (-not $m) { throw "AI model not bundled" }
          $m | ForEach-Object { "$($_.FullName) $([math]::Round($_.Length/1MB,1)) MB" }
      - name: Installer
        shell: pwsh
        run: |
          $ver = (python -c "import keepframe; print(keepframe.__version__)").Trim()
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}".TrimStart("v") }
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive -Path dist\KeepFrame\* -DestinationPath dist\KeepFrame-portable.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: KeepFrame ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: |
            dist/KeepFrame-Setup-*.exe
            dist/KeepFrame-portable.zip
